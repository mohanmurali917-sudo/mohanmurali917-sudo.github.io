<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMM Nexus | Welcome</title>
  <meta name="description" content="Welcome to MMM Nexus - Official Digital Hub of Murali Mohan.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #1e293b, #090d16);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      padding: 40px 25px;
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(56, 189, 248, 0.25);
    }
    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      font-weight: 800;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h2 {
      margin: 0 0 14px;
      font-size: 16px;
      font-weight: 500;
      color: #e2e8f0;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: block;
      text-decoration: none;
      color: #fff;
      padding: 14px;
      margin: 12px 0;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      transition: transform 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-yt { background: linear-gradient(90deg, #dc2626, #ef4444); }
    .btn-ig { background: linear-gradient(90deg, #db2777, #9333ea); }
    .btn-gh { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); }
    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Official Hub</div>
    <h1>Welcome to MMM Nexus</h1>
    <h2>Murali Mohan</h2>
    <p>Building the future, exploring technology, and creating digital innovation.</p>
    
    <a class="btn btn-yt" href="https://www.youtube.com/@muralimohan2723" target="_blank">YouTube Channel</a>
    <a class="btn btn-ig" href="https://www.instagram.com/" target="_blank">Instagram</a>
    <a class="btn btn-gh" href="https://github.com/mohanmurali917-sudo" target="_blank">GitHub Profile</a>
    
    <div class="footer">© 2026 MMM Nexus. All Rights Reserved.</div>
  </div>
</body>
      </html>
