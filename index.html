<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MMM Nexus | AI Ecosystem</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: #09090b;
      color: #f4f4f5;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: #111114;
      border-bottom: 1px solid #27272a;
      flex-shrink: 0;
    }
    .brand { display: flex; flex-direction: column; }
    .brand h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #f59e0b, #fbbf24, #fde68a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand span { font-size: 0.72rem; color: #a1a1aa; margin-top: 2px; }
    .founder-btn {
      background: #18181b;
      color: #fbbf24;
      border: 1px solid #3f3f46;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    .msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.96rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
      position: relative;
    }
    .ai-msg {
      align-self: flex-start;
      background: #141417;
      border-left: 3px solid #f59e0b;
      color: #f4f4f5;
      padding-bottom: 34px;
    }
    .copy-btn {
      position: absolute;
      bottom: 6px;
      right: 10px;
      background: #27272a;
      color: #fbbf24;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 2px 8px;
      font-size: 0.72rem;
      cursor: pointer;
    }
    .user-msg {
      align-self: flex-end;
      background: linear-gradient(135deg, #d97706, #f59e0b);
      color: #000000;
      font-weight: 700;
    }
    .input-bar {
      display: flex;
      gap: 8px;
      padding: 12px 14px;
      background: #111114;
      border-top: 1px solid #27272a;
      flex-shrink: 0;
      align-items: center;
    }
    .input-bar input {
      flex: 1;
      background: #18181b;
      border: 1px solid #3f3f46;
      color: #ffffff;
      padding: 12px 14px;
      border-radius: 25px;
      font-size: 0.96rem;
      outline: none;
    }
    .input-bar input:focus { border-color: #f59e0b; }
    .mic-btn {
      background: #18181b;
      color: #fbbf24;
      border: 1px solid #3f3f46;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .mic-btn.listening {
      background: #dc2626;
      color: #ffffff;
      border-color: #ef4444;
    }
    .send-btn {
      background: #f59e0b;
      color: #000000 !important;
      border: none;
      padding: 0 18px;
      height: 44px;
      border-radius: 25px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 50;
    }
    .modal-card {
      background: #141417;
      border: 1px solid #f59e0b;
      border-radius: 18px;
      padding: 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }
    .modal-card h2 { color: #fbbf24; margin-bottom: 10px; font-size: 1.2rem; }
    .modal-card p { color: #d4d4d8; font-size: 0.9rem; line-height: 1.5; margin-bottom: 16px; }
    .modal-card button {
      background: #f59e0b;
      color: #000000;
      border: none;
      padding: 9px 22px;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <h1>✨ MMM NEXUS</h1>
      <span>AI Ecosystem • By Murali Mohan</span>
    </div>
    <button class="founder-btn" onclick="toggleModal(true)">ℹ️ Founder</button>
  </div>

  <div class="chat-box" id="chatBox">
    <div class="msg ai-msg">నమస్తే! నేను MMM Nexus AI. అచ్చం మీ పర్సనల్ AI అసిస్టెంట్ లాగా నన్ను ఏదైనా అడగండి! 🚀<button class="copy-btn" onclick="copyText(this)">📋 Copy</button></div>
  </div>

  <div class="input-bar">
    <input type="text" id="userInput" placeholder="Ask or tap mic..." onkeypress="if(event.key==='Enter') sendMessage()" />
    <button class="mic-btn" id="micBtn" onclick="startVoice()" title="Voice Input">🎤</button>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
  </div>

  <div class="modal" id="founderModal" onclick="if(event.target===this) toggleModal(false)">
    <div class="modal-card">
      <h2>👑 Murali Mohan</h2>
      <p>Founder & Creator of <strong>MMM Nexus</strong> — an AI-powered digital ecosystem built from scratch to make smart technology accessible to everyone.</p>
      <button onclick="toggleModal(false)">Close</button>
    </div>
  </div>

  <script>
    const BACKEND_URL = "https://mmm-nexus-backend.onrender.com/chat";
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const micBtn = document.getElementById("micBtn");

    function toggleModal(show) {
      document.getElementById("founderModal").style.display = show ? "flex" : "none";
    }

    function copyText(btn) {
      const text = btn.parentElement.firstChild.textContent;
      navigator.clipboard.writeText(text);
      btn.textContent = "✅ Copied";
      setTimeout(() => btn.textContent = "📋 Copy", 1500);
    }

    function addMsg(text, cls, withCopy = false) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      if (withCopy) {
        const btn = document.createElement("button");
        btn.className = "copy-btn";
        btn.textContent = "📋 Copy";
        btn.onclick = () => copyText(btn);
        div.appendChild(btn);
      }
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function startVoice() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Voice input is not supported in this browser.");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = "en-IN";
      recognition.onstart = () => micBtn.classList.add("listening");
      recognition.onend = () => micBtn.classList.remove("listening");
      recognition.onresult = (e) => {
        userInput.value = e.results[0][0].transcript;
      };
      recognition.start();
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      addMsg(text, "user-msg");
      userInput.value = "";
      sendBtn.disabled = true;

      const loading = addMsg("Thinking...", "ai-msg", true);
      const wakeTimer = setTimeout(() => {
        loading.firstChild.textContent = "Server waking up (first message takes ~25s)... ⏳";
      }, 4500);

      try {
        const res = await fetch(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        clearTimeout(wakeTimer);
        const data = await res.json();
        if (data.reply) {
          loading.firstChild.textContent = data.reply;
        } else {
          loading.firstChild.textContent = "⚠️ " + (data.error || "Something went wrong. Please try again.");
        }
      } catch (err) {
        clearTimeout(wakeTimer);
        loading.firstChild.textContent = "⚠️ Connection error. Please wait 10 seconds and try again.";
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    }
  </script>
</body>
        </html>
