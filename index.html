<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMM Nexus | Founders Demo v1.0</title>
  <meta name="description" content="MMM Nexus - Founders Demo v1.0 | Official Digital Hub of Murali Mohan.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #1c1917 0%, #09090b 75%, #000000 100%);
      color: #fafafa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: linear-gradient(145deg, rgba(24, 24, 27, 0.9), rgba(9, 9, 11, 0.96));
      backdrop-filter: blur(14px);
      padding: 38px 26px;
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 35px rgba(212, 175, 55, 0.14);
      border: 1px solid rgba(212, 175, 55, 0.38);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #f59e0b, #fde047, #d97706, transparent);
    }
    .badge {
      display: inline-block;
      background: rgba(212, 175, 55, 0.12);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.35);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.4px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #fef08a 0%, #f59e0b 50%, #b45309 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13px;
      font-weight: 600;
      color: #d4af37;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    h2 {
      font-size: 17px;
      font-weight: 600;
      color: #f4f4f5;
      margin-bottom: 10px;
    }
    p {
      color: #a1a1aa;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .status-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #d4d4d8;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      margin-right: 6px;
      box-shadow: 0 0 8px #22c55e;
    }
    .btn {
      display: block;
      text-decoration: none;
      padding: 14px;
      margin: 12px 0;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.4px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-gold {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #09090b;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.28);
    }
    .btn-dark {
      background: rgba(255, 255, 255, 0.04);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.3);
    }
    .footer {
      margin-top: 26px;
      font-size: 11px;
      color: #71717a;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Founders Demo v1.0</div>
    <h1>MMM NEXUS</h1>
    <div class="subtitle">Next-Gen Digital Ecosystem</div>
    <h2>Murali Mohan</h2>
    <p>Building the future, exploring technology, and creating scalable digital innovation.</p>

    <div class="status-box">
      <span><span class="dot"></span>System Live</span>
      <span style="color: #fbbf24; font-weight: 600;">v1.0 • Build 2026</span>
    </div>

    <a class="btn btn-gold" href="https://www.youtube.com/@muralimohan2723" target="_blank">YouTube Channel</a>
    <a class="btn btn-dark" href="https://www.instagram.com/murali_mmm_999" target="_blank">Instagram</a>
    <a class="btn btn-dark" href="https://github.com/mohanmurali917-sudo" target="_blank">GitHub Profile</a>

    <div class="footer">© 2026 MMM Nexus • Founder Edition</div>
  </div>
</body>
  </html>
