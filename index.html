<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#09090b" />
  <title>MMM Nexus | AI</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #09090b; color: #f4f4f5; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    .top { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #111114; border-bottom: 1px solid #27272a; }
    .row { display: flex; align-items: center; gap: 7px; }
    .top h1 { font-size: 1.05rem; color: #fbbf24; }
    .btn { background: #18181b; color: #fbbf24; border: 1px solid #3f3f46; padding: 6px 11px; border-radius: 14px; font-weight: 700; font-size: 0.83rem; cursor: pointer; }
    .chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 88%; padding: 11px 14px; border-radius: 16px; font-size: 0.94rem; line-height: 1.5; word-wrap: break-word; }
    .ai { align-self: flex-start; background: #141417; border: 1px solid #27272a; border-left: 3px solid #f59e0b; }
    .user { align-self: flex-end; background: #f59e0b; color: #000; font-weight: 600; white-space: pre-wrap; }
    .msg img { max-width: 100%; border-radius: 10px; margin-bottom: 7px; display: block; }
    .u-edit { display: inline-block; margin-top: 5px; background: rgba(0,0,0,0.18); color: #000; border: none; padding: 3px 8px; border-radius: 7px; font-size: 0.74rem; font-weight: 700; cursor: pointer; }
    .md h2, .md h3 { color: #fbbf24; margin: 6px 0 3px; font-size: 1rem; }
    .md ul { padding-left: 18px; margin: 4px 0; }
    .md code { background: #27272a; color: #fde047; padding: 2px 5px; border-radius: 5px; font-family: monospace; font-size: 0.85rem; }
    .c-box { background: #09090b; border: 1px solid #3f3f46; border-radius: 10px; margin: 7px 0; overflow: hidden; }
    .c-hdr { display: flex; justify-content: space-between; background: #1f1f23; padding: 4px 9px; font-size: 0.75rem; color: #a1a1aa; }
    .c-box pre { padding: 9px; overflow-x: auto; font-family: monospace; font-size: 0.82rem; color: #e4e4e7; white-space: pre; }
    .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding-top: 6px; border-top: 1px solid #27272a; }
    .chip { background: #1f1f23; color: #fbbf24; border: 1px solid #3f3f46; padding: 4px 9px; border-radius: 8px; text-decoration: none; font-size: 0.76rem; font-weight: 700; cursor: pointer; }
    .sugs { display: flex; flex-wrap: wrap; gap: 7px; }
    .sug { background: #18181b; border: 1px solid #3f3f46; color: #e4e4e7; padding: 7px 11px; border-radius: 15px; font-size: 0.81rem; cursor: pointer; }
    .prev { display: none; padding: 8px 14px; background: #18181b; align-items: center; gap: 10px; font-size: 0.82rem; color: #fbbf24; border-top: 1px solid #27272a; }
    .prev img { width: 36px; height: 36px; object-fit: cover; border-radius: 6px; }
    .bar { display: flex; gap: 6px; padding: 9px; background: #111114; border-top: 1px solid #27272a; align-items: center; }
    .bar input[type="text"] { flex: 1; min-width: 0; background: #18181b; border: 1px solid #3f3f46; color: #fff; padding: 10px 12px; border-radius: 20px; font-size: 0.93rem; outline: none; }
    .ico { width: 38px; height: 38px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 1.05rem; }
    .ico.rec { background: #dc2626; color: #fff; border-color: #ef4444; }
    .send { background: #f59e0b; color: #000; border: none; padding: 10px 14px; border-radius: 20px; font-weight: 800; cursor: pointer; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.82); align-items: flex-end; z-index: 50; }
    .modal.c { align-items: center; justify-content: center; padding: 14px; }
    .sheet { width: 100%; background: #141417; border-top: 1px solid #f59e0b; border-radius: 20px 20px 0 0; padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .opt { background: #1f1f23; border: 1px solid #3f3f46; color: #fbbf24; padding: 13px 10px; border-radius: 14px; font-weight: 700; font-size: 0.86rem; text-align: center; cursor: pointer; }
    .card { width: 100%; max-width: 420px; background: #141417; border: 1px solid #f59e0b; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .card input, .card select { background: #18181b; border: 1px solid #3f3f46; color: #fff; padding: 10px; border-radius: 12px; font-size: 0.9rem; outline: none; }
    .side-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 60; }
    .side { width: 260px; max-width: 80vw; height: 100%; background: #111114; border-right: 1px solid #27272a; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .h-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .h-item { display: flex; justify-content: space-between; align-items: center; background: #18181b; border: 1px solid #27272a; padding: 10px; border-radius: 10px; font-size: 0.85rem; cursor: pointer; }
    .h-item.act { border-color: #f59e0b; }
    .run-box { width: 100%; height: 85vh; background: #fff; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; border: 2px solid #f59e0b; }
    .run-box iframe { flex: 1; width: 100%; border: none; background: #fff; }
  </style>
</head>
<body>
  <div class="top">
    <div class="row"><button class="btn" id="menuBtn">☰</button><h1>✨ MMM NEXUS</h1></div>
    <div class="row"><button class="btn" id="instBtn">📲 App</button><button class="btn" id="newBtn">+ New</button></div>
  </div>
  <div class="side-bg" id="sideBg"><div class="side"><div style="display:flex;justify-content:space-between;color:#fbbf24;font-weight:800;"><span>💬 History</span><button class="btn" id="closeSide">✕</button></div><div class="h-list" id="hList"></div></div></div>
  <div class="chat" id="chat"></div>
  <div class="prev" id="prev"><img id="pImg" src="" /><span id="pTxt" style="flex:1">Ready</span><button class="btn" id="clrAtt">✕</button></div>
  <div class="bar">
    <input type="file" id="fileIn" accept="image/*" style="display:none" /><input type="file" id="docIn" accept=".pdf,.txt,.md,.csv,.html,.js,.py" style="display:none" />
    <button class="btn ico" id="plusBtn">+</button><input type="text" id="inp" placeholder="Ask anything in any language..." />
    <button class="btn ico" id="micBtn">🎤</button><button class="send" id="sendBtn">Send</button>
  </div>
  <div class="modal" id="sheet"><div class="sheet">
    <div class="opt" id="optPhoto">📷 Analyze Photo</div><div class="opt" id="optImg">🎨 AI Image Studio</div>
    <div class="opt" id="optDoc">📄 PDF / Notes</div><div class="opt" id="optStudy">🎓 Study Helper</div>
    <div class="opt" id="optCode">💻 Live Code Box</div><div class="opt" id="optClose">✕ Close</div>
  </div></div>
  <div class="modal c" id="imgModal"><div class="card">
    <h3 style="color:#fbbf24">🎨 AI Image Studio</h3>
    <input type="text" id="imPrompt" placeholder="Describe image (e.g. Royal lion)" />
    <select id="imSize"><option value="1024x1024">Square (1:1)</option><option value="1280x720">YouTube (16:9)</option><option value="720x1280">Status / Reel (9:16)</option></select>
    <select id="imStyle"><option value="">Default HD</option><option value=", ultra realistic 8k photo">Realistic</option><option value=", 3D Pixar cartoon style">3D Cartoon</option><option value=", Telugu cinema mass poster style">Cinema Poster</option></select>
    <div style="display:flex;gap:8px;justify-content:flex-end;"><button class="btn" id="imCancel">Cancel</button><button class="send" id="imGo">Generate</button></div>
  </div></div>
  <div class="modal c" id="runModal"><div class="run-box"><div style="background:#111114;color:#fbbf24;padding:10px;display:flex;justify-content:space-between;font-weight:700;"><span>💻 Live Preview</span><button class="btn" id="runClose">✕</button></div><iframe id="runFrame"></iframe></div></div>
  <script>
    const API = "https://mmm-nexus-backend.onrender.com", $ = id => document.getElementById(id);
    let imgB64 = null, imgMime = "image/jpeg", imgPrev = null, docCtx = null, study = false, sessions = [], curId = null, defPrompt = null, lastReq = null, imgCool = 0;
    try { sessions = JSON.parse(localStorage.getItem("mmm_v7") || "[]"); } catch (e) {}
    window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); defPrompt = e; });
    $("instBtn").onclick = () => defPrompt ? defPrompt.prompt() : alert("📲 Chrome (⋮) → 'Add to Home screen' నొక్కండి!");
    const save = () => { try { localStorage.setItem("mmm_v7", JSON.stringify(sessions)); } catch (e) {} renderHist(); };
    const copy = (t, b) => navigator.clipboard.writeText(t).then(() => { const o = b.textContent; b.textContent = "✅ Copied"; setTimeout(() => b.textContent = o, 1400); });
    function renderHist() {
      $("hList").innerHTML = "";
      sessions.forEach(s => {
        const r = document.createElement("div"); r.className = "h-item" + (s.id === curId ? " act" : "");
        r.innerHTML = `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px">${s.title}</span><span style="color:#ef4444">🗑️</span>`;
        r.lastChild.onclick = e => { e.stopPropagation(); sessions = sessions.filter(x => x.id !== s.id); sessions.length ? (curId = sessions[0].id, save(), load()) : newChat(); };
        r.onclick = () => { curId = s.id; save(); load(); $("sideBg").style.display = "none"; };
        $("hList").appendChild(r);
      });
    }
    function fmt(raw) {
      let e = raw.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"), bl = [];
      e = e.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, c) => (bl.push({ l: l || "code", c: c.trim() }), `@@C${bl.length - 1}@@`));
      e = e.replace(/^### (.*$)/gm, "<h3>$1</h3>").replace(/^## (.*$)/gm, "<h2>$1</h2>").replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/^[*-] (.*$)/gm, "<li>$1</li>");
      e = e.replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`).replace(/\n/g, "<br>");
      bl.forEach((b, i) => e = e.replace(`@@C${i}@@`, `<div class="c-box"><div class="c-hdr"><span>${b.l}</span><button class="chip cc" data-i="${i}">📋 Copy Code</button></div><pre>${b.c}</pre></div>`));
      return { html: e, bl };
    }
    function speak(t) {
      if (!("speechSynthesis" in window)) return; speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(t.replace(/```[\s\S]*?```/g, "Code."));
      u.lang = /[\u0C00-\u0C7F]/.test(t) ? "te-IN" : (/[\u0900-\u097F]/.test(t) ? "hi-IN" : "en-IN"); speechSynthesis.speak(u);
    }
    function addMsg(t, y, img, canSave, isErr, idx) {
      const d = document.createElement("div"); d.className = "msg " + y;
      if (img) { const im = document.createElement("img"); im.src = img; d.appendChild(im); }
      const box = document.createElement("div");
      if (y === "user") {
        box.textContent = t;
        const eb = document.createElement("button"); eb.className = "u-edit"; eb.textContent = "✏️ Edit";
        eb.onclick = () => { const s = sessions.find(x => x.id === curId); if (s && idx >= 0) { s.msgs = s.msgs.slice(0, idx); save(); load(); } $("inp").value = t.replace(/^🎨 Create image: /, ""); $("inp").focus(); };
        d.append(box, eb); $("chat").appendChild(d); $("chat").scrollTop = $("chat").scrollHeight; return { d, box };
      }
      box.className = "md"; const p = fmt(t); box.innerHTML = p.html;
      box.querySelectorAll(".cc").forEach(b => b.onclick = () => copy(p.bl[b.dataset.i].c, b));
      d.appendChild(box);
      const row = document.createElement("div"); row.className = "acts";
      if (canSave && img) row.innerHTML = `<a href="${img}" target="_blank" download="MMM.jpg" class="chip">⬇️ Save HD</a>`;
      else if (t) {
        const b1 = document.createElement("button"); b1.className = "chip"; b1.textContent = "📋 Copy"; b1.onclick = () => copy(t, b1); row.appendChild(b1);
        const b2 = document.createElement("button"); b2.className = "chip"; b2.textContent = "🔊 Listen"; b2.onclick = () => speak(t); row.appendChild(b2);
        const m = t.match(/```(?:html|xml)?\s*([\s\S]*?)```/i), code = m && m[1].includes("<") ? m[1] : (t.includes("<html") ? t : null);
        if (code) { const b3 = document.createElement("button"); b3.className = "chip"; b3.textContent = "▶️ Run"; b3.onclick = () => { $("runFrame").srcdoc = code; $("runModal").style.display = "flex"; }; row.appendChild(b3); }
        if (isErr && lastReq) { const b4 = document.createElement("button"); b4.className = "chip"; b4.textContent = "🔄 Retry"; b4.onclick = () => { $("inp").value = lastReq; send(); }; row.appendChild(b4); }
      }
      if (row.children.length) d.appendChild(row);
      $("chat").appendChild(d); $("chat").scrollTop = $("chat").scrollHeight; return { d, box };
    }
    function newChat() {
      curId = Date.now().toString();
      sessions.unshift({ id: curId, title: "New Chat", msgs: [{ t: "Hello **Murali**! Welcome to **MMM Nexus** 🚀\nAsk me in **any language** (Telugu, English, Hindi, Tamil, etc.) — with **Edit**, **Copy**, **Memory**, **Image Studio** & **PDF Reader**!", y: "ai" }] });
      save(); load();
      const r = document.createElement("div"); r.className = "sugs";
      [["✍️ HTML Page", "Create a modern portfolio webpage in HTML and CSS"], ["🎓 Explain Topic", "Explain Cloud Computing simply with bullet points"], ["🎨 Create Image", ""], ["📄 Read PDF", ""]].forEach(([l, p]) => {
        const b = document.createElement("button"); b.className = "sug"; b.textContent = l;
        b.onclick = () => p ? ($("inp").value = p, send()) : (l.includes("Image") ? $("imgModal").style.display = "flex" : $("docIn").click());
        r.appendChild(b);
      });
      $("chat").appendChild(r);
    }
    function load() { const s = sessions.find(x => x.id === curId) || sessions[0]; if (!s) return newChat(); curId = s.id; $("chat").innerHTML = ""; s.msgs.forEach((m, i) => addMsg(m.t, m.y, m.img, m.save, false, i)); }
    function push(t, y, img, sf) { const s = sessions.find(x => x.id === curId); if (!s) return -1; if (y === "user" && s.title === "New Chat") s.title = t.slice(0, 22); s.msgs.push({ t, y, img, save: sf }); save(); return s.msgs.length - 1; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) { const r = new SR(); r.lang = "en-IN"; r.onstart = () => $("micBtn").classList.add("rec"); r.onend = () => $("micBtn").classList.remove("rec"); r.onresult = e => $("inp").value = ($("inp").value + " " + e.results[0][0].transcript).trim(); $("micBtn").onclick = () => { try { r.start(); } catch (e) {} }; }
    $("newBtn").onclick = newChat; $("menuBtn").onclick = () => { renderHist(); $("sideBg").style.display = "block"; }; $("closeSide").onclick = () => $("sideBg").style.display = "none";
    $("plusBtn").onclick = () => $("sheet").style.display = "flex"; $("optClose").onclick = () => $("sheet").style.display = "none";
    $("runClose").onclick = () => { $("runModal").style.display = "none"; $("runFrame").srcdoc = ""; };
    $("optPhoto").onclick = () => { $("sheet").style.display = "none"; $("fileIn").click(); }; $("optDoc").onclick = () => { $("sheet").style.display = "none"; $("docIn").click(); };
    $("optImg").onclick = () => { $("sheet").style.display = "none"; $("imgModal").style.display = "flex"; }; $("imCancel").onclick = () => $("imgModal").style.display = "none";
    $("optStudy").onclick = () => { $("sheet").style.display = "none"; study = !study; $("inp").placeholder = study ? "🎓 Study Mode ON..." : "Ask anything in any language..."; };
    $("optCode").onclick = () => { $("sheet").style.display = "none"; const c = prompt("Paste HTML code:"); if (c) { $("runFrame").srcdoc = c; $("runModal").style.display = "flex"; } };
    $("clrAtt").onclick = () => { imgB64 = imgPrev = docCtx = null; $("fileIn").value = $("docIn").value = ""; $("prev").style.display = "none"; };
    $("fileIn").onchange = e => { const f = e.target.files[0]; if (!f) return; imgMime = f.type || "image/jpeg"; const r = new FileReader(); r.onload = ev => { imgPrev = ev.target.result; imgB64 = imgPrev.split(",")[1]; $("pImg").src = imgPrev; $("pImg").style.display = "block"; $("pTxt").textContent = "Photo ready"; $("prev").style.display = "flex"; }; r.readAsDataURL(f); };
    $("docIn").onchange = async e => {
      const f = e.target.files[0]; if (!f) return; $("pImg").style.display = "none"; $("pTxt").textContent = "Reading " + f.name + "..."; $("prev").style.display = "flex";
      try {
        if (f.name.toLowerCase().endsWith(".pdf") && window.pdfjsLib) {
          pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
          const pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise; let txt = "";
          for (let i = 1; i <= Math.min(pdf.numPages, 12); i++) { const p = await pdf.getPage(i); txt += (await p.getTextContent()).items.map(x => x.str).join(" ") + "\n"; }
          docCtx = txt.slice(0, 12000);
        } else docCtx = (await f.text()).slice(0, 12000);
        $("pTxt").textContent = "📄 " + f.name + " ready!";
      } catch (err) { $("pTxt").textContent = "⚠️ File error"; }
    };
    function makeImg(p, size = "1024x1024", style = "") {
      const wSec = Math.ceil((imgCool - Date.now()) / 1000);
      if (wSec > 0) return addMsg(`⏱️ Free image cooldown: wait **${wSec}s** for next image.`, "ai");
      const [w, h] = size.split("x"), idx = push("🎨 Create image: " + p, "user");
      addMsg("🎨 Create image: " + p, "user", null, false, false, idx);
      const ld = addMsg("🎨 Generating HD image (~6s)...", "ai");
      const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(p + style)}?width=${w}&height=${h}&nologo=true&model=flux&seed=${Math.floor(Math.random()*999999)}`;
      const im = new Image();
      im.onload = () => { imgCool = Date.now() + 45000; ld.d.remove(); addMsg("✨ " + p, "ai", url, true); push("✨ " + p, "ai", url, true); };
      im.onerror = () => ld.box.textContent = "⚠️ Free image server busy. Try again in 30s.";
      im.src = url;
    }
    $("imGo").onclick = () => { const p = $("imPrompt").value.trim(); if (!p) return; $("imgModal").style.display = "none"; $("imPrompt").value = ""; makeImg(p, $("imSize").value, $("imStyle").value); };
    async function send() {
      const txt = $("inp").value.trim(); if (!txt && !imgB64 && !docCtx) return;
      if (!imgB64 && !docCtx && /create.*image|pic kavali|photo kavali|image kavali|^draw /i.test(txt)) { $("inp").value = ""; return makeImg(txt); }
      lastReq = txt; const disp = txt || (docCtx ? "Summarize document" : "Analyze photo");
      const s = sessions.find(x => x.id === curId), hist = s ? s.msgs.slice(-6).map(m => `${m.y === "user" ? "User" : "Assistant"}: ${m.t}`).join("\n") : "";
      const idx = push(disp, "user", imgPrev); addMsg(disp, "user", imgPrev, false, false, idx);
      let msg = (hist ? `Recent Chat:\n${hist}\n\n` : "") + (docCtx ? `Document:\n${docCtx}\n\n` : "") + `Request: ${disp}`;
      if (study) msg = "[Explain clearly step-by-step for student] " + msg;
      const sImg = imgB64, sMime = imgMime; $("inp").value = ""; $("clrAtt").click(); $("sendBtn").disabled = true;
      const ld = addMsg("Thinking...", "ai");
      try {
        const res = await fetch(API + "/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: msg, image: sImg, mimeType: sMime }) });
        const d = await res.json(), rep =
