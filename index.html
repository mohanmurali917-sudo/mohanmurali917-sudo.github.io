<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#09090b" />
  <title>MMM Nexus | AI</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #09090b; color: #f4f4f5; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    .top { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #111114; border-bottom: 1px solid #27272a; }
    .top-left, .top-right { display: flex; align-items: center; gap: 7px; }
    .top h1 { font-size: 1.05rem; color: #fbbf24; }
    .btn { background: #18181b; color: #fbbf24; border: 1px solid #3f3f46; padding: 6px 11px; border-radius: 14px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
    .chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 86%; padding: 11px 14px; border-radius: 15px; font-size: 0.94rem; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
    .ai { align-self: flex-start; background: #141417; border-left: 3px solid #f59e0b; }
    .user { align-self: flex-end; background: #f59e0b; color: #000; font-weight: 700; }
    .msg img { max-width: 100%; border-radius: 10px; margin-bottom: 6px; display: block; }
    .act-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { background: #27272a; color: #fbbf24; border: 1px solid #3f3f46; padding: 4px 10px; border-radius: 8px; text-decoration: none; font-size: 0.78rem; font-weight: 700; cursor: pointer; }
    .prev { display: none; padding: 8px 14px; background: #18181b; align-items: center; gap: 10px; font-size: 0.82rem; color: #fbbf24; border-top: 1px solid #27272a; }
    .prev img { width: 38px; height: 38px; object-fit: cover; border-radius: 6px; }
    .bar { display: flex; gap: 6px; padding: 9px; background: #111114; border-top: 1px solid #27272a; align-items: center; }
    .bar input[type="text"] { flex: 1; min-width: 0; background: #18181b; border: 1px solid #3f3f46; color: #fff; padding: 10px 12px; border-radius: 20px; font-size: 0.93rem; outline: none; }
    .ico { width: 38px; height: 38px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
    .ico.rec { background: #dc2626; color: #fff; border-color: #ef4444; }
    .send { background: #f59e0b; color: #000; border: none; padding: 10px 14px; border-radius: 20px; font-weight: 800; cursor: pointer; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: flex-end; z-index: 50; }
    .modal.center { align-items: center; justify-content: center; padding: 14px; }
    .sheet-box { width: 100%; background: #141417; border-top: 1px solid #f59e0b; border-radius: 20px 20px 0 0; padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .opt { background: #1f1f23; border: 1px solid #3f3f46; color: #fbbf24; padding: 13px 10px; border-radius: 14px; font-weight: 700; font-size: 0.88rem; text-align: center; cursor: pointer; }
    .card { width: 100%; max-width: 420px; background: #141417; border: 1px solid #f59e0b; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .card input, .card select { background: #18181b; border: 1px solid #3f3f46; color: #fff; padding: 10px; border-radius: 12px; font-size: 0.9rem; outline: none; }
    .side-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 60; }
    .side { width: 260px; max-width: 80vw; height: 100%; background: #111114; border-right: 1px solid #27272a; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .h-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .h-item { display: flex; justify-content: space-between; align-items: center; background: #18181b; border: 1px solid #27272a; padding: 10px; border-radius: 10px; font-size: 0.85rem; cursor: pointer; }
    .h-item.act { border-color: #f59e0b; }
    .run-box { width: 100%; height: 85vh; background: #fff; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; border: 2px solid #f59e0b; }
    .run-box iframe { flex: 1; width: 100%; border: none; background: #fff; }
  </style>
</head>
<body>
  <div class="top">
    <div class="top-left"><button class="btn" id="menuBtn">☰</button><h1>✨ MMM NEXUS</h1></div>
    <div class="top-right"><button class="btn" id="instBtn">📲 App</button><button class="btn" id="newBtn">+ New</button></div>
  </div>
  <div class="side-bg" id="sideBg"><div class="side"><div style="display:flex;justify-content:space-between;color:#fbbf24;font-weight:800;"><span>💬 History</span><button class="btn" id="closeSide">✕</button></div><div class="h-list" id="hList"></div></div></div>
  <div class="chat" id="chat"></div>
  <div class="prev" id="prev"><img id="pImg" src="" /><span id="pTxt" style="flex:1">Ready</span><button class="btn" id="clrAtt">✕</button></div>
  <div class="bar">
    <input type="file" id="fileIn" accept="image/*" style="display:none" />
    <input type="file" id="docIn" accept=".pdf,.txt,.md,.csv,.html,.js,.py" style="display:none" />
    <button class="btn ico" id="plusBtn">+</button>
    <input type="text" id="inp" placeholder="Ask, speak, or create image..." />
    <button class="btn ico" id="micBtn">🎤</button>
    <button class="send" id="sendBtn">Send</button>
  </div>
  <div class="modal" id="sheet">
    <div class="sheet-box">
      <div class="opt" id="optPhoto">📷 Upload Photo</div>
      <div class="opt" id="optImg">🎨 AI Image Studio</div>
      <div class="opt" id="optDoc">📄 PDF / Notes</div>
      <div class="opt" id="optStudy">🎓 Study Helper</div>
      <div class="opt" id="optCode">💻 Test Live Code</div>
      <div class="opt" id="optClose">✕ Close</div>
    </div>
  </div>
  <div class="modal center" id="imgModal">
    <div class="card">
      <h3 style="color:#fbbf24">🎨 AI Image Studio</h3>
      <input type="text" id="imPrompt" placeholder="Describe image (e.g. Royal lion)" />
      <select id="imSize"><option value="1024x1024">Square (1:1)</option><option value="1280x720">YouTube (16:9)</option><option value="720x1280">Status / Reel (9:16)</option></select>
      <select id="imStyle"><option value="">Default HD</option><option value=", ultra realistic 8k photo">Realistic</option><option value=", 3D Pixar cartoon style">3D Cartoon</option><option value=", Telugu cinema mass poster style">Cinema Poster</option></select>
      <div style="display:flex;gap:8px;justify-content:flex-end;"><button class="btn" id="imCancel">Cancel</button><button class="send" id="imGo">Generate</button></div>
    </div>
  </div>
  <div class="modal center" id="runModal"><div class="run-box"><div style="background:#111114;color:#fbbf24;padding:10px;display:flex;justify-content:space-between;font-weight:700;"><span>💻 Live Preview</span><button class="btn" id="runClose">✕</button></div><iframe id="runFrame"></iframe></div></div>
  <script>
    const API = "https://mmm-nexus-backend.onrender.com", $ = id => document.getElementById(id);
    let imgB64 = null, imgMime = "image/jpeg", imgPrev = null, docCtx = null, study = false, sessions = [], curId = null, defPrompt = null;
    try { sessions = JSON.parse(localStorage.getItem("mmm_v4") || "[]"); } catch (e) {}

    window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); defPrompt = e; });
    $("instBtn").onclick = () => defPrompt ? defPrompt.prompt() : alert("📲 Chrome పైన (⋮) నొక్కి → 'Add to Home screen' నొక్కండి!");

    function save() { try { localStorage.setItem("mmm_v4", JSON.stringify(sessions)); } catch (e) {} renderHist(); }
    function renderHist() {
      $("hList").innerHTML = "";
      sessions.forEach(s => {
        const r = document.createElement("div"); r.className = "h-item" + (s.id === curId ? " act" : "");
        r.innerHTML = `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px">${s.title}</span><span style="color:#ef4444">🗑️</span>`;
        r.lastChild.onclick = e => { e.stopPropagation(); sessions = sessions.filter(x => x.id !== s.id); sessions.length ? (curId = sessions[0].id, save(), load()) : newChat(); };
        r.onclick = () => { curId = s.id; save(); load(); $("sideBg").style.display = "none"; };
        $("hList").appendChild(r);
      });
    }

    function speak(t) {
      if (!("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(t.replace(/```[\s\S]*?```/g, "Code."));
      u.lang = /[\u0C00-\u0C7F]/.test(t) ? "te-IN" : "en-IN";
      speechSynthesis.speak(u);
    }

    function getCode(t) {
      const m = t.match(/```(?:html|xml)?\s*([\s\S]*?)```/i);
      return m && m[1].includes("<") ? m[1] : (t.includes("<html") || t.includes("<!DOCTYPE") ? t : null);
    }

    function addActions(d, t, img, canSave) {
      const row = document.createElement("div"); row.className = "act-row";
      if (canSave && img) row.innerHTML = `<a href="${img}" target="_blank" download="MMM.jpg" class="chip">⬇️ Save HD</a>`;
      else if (t) {
        const b1 = document.createElement("button"); b1.className = "chip"; b1.textContent = "🔊 Listen"; b1.onclick = () => speak(t); row.appendChild(b1);
        const c = getCode(t);
        if (c) { const b2 = document.createElement("button"); b2.className = "chip"; b2.textContent = "▶️ Run Code"; b2.onclick = () => { $("runFrame").srcdoc = c; $("runModal").style.display = "flex"; }; row.appendChild(b2); }
      }
      if (row.children.length) d.appendChild(row);
    }

    function addMsg(t, y, img, canSave) {
      const d = document.createElement("div"); d.className = "msg " + y;
      if (img) { const im = document.createElement("img"); im.src = img; d.appendChild(im); }
      const sp = document.createElement("span"); sp.textContent = t; d.appendChild(sp);
      if (y === "ai") addActions(d, t, img, canSave);
      $("chat").appendChild(d); $("chat").scrollTop = $("chat").scrollHeight;
      return { d, sp };
    }

    function newChat() {
      curId = Date.now().toString();
      sessions.unshift({ id: curId, title: "New Chat", msgs: [{ t: "నమస్తే మురళి! MMM Nexus Pro Ready 🚀\n🎤 Voice, 🎨 Image Studio, 📄 PDF Reader & 💻 Live Code అన్నీ రెడీ!", y: "ai" }] });
      save(); load();
    }

    function load() {
      const s = sessions.find(x => x.id === curId) || sessions[0];
      if (!s) return newChat();
      curId = s.id; $("chat").innerHTML = "";
      s.msgs.forEach(m => addMsg(m.t, m.y, m.img, m.save));
    }

    function push(t, y, img, saveFlag) {
      const s = sessions.find(x => x.id === curId); if (!s) return;
      if (y === "user" && s.title === "New Chat") s.title = t.slice(0, 22);
      s.msgs.push({ t, y, img, save: saveFlag }); save();
    }

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      const r = new SR(); r.lang = "en-IN";
      r.onstart = () => $("micBtn").classList.add("rec");
      r.onend = () => $("micBtn").classList.remove("rec");
      r.onresult = e => { $("inp").value = ($("inp").value + " " + e.results[0][0].transcript).trim(); };
      $("micBtn").onclick = () => { try { r.start(); } catch (e) {} };
    } else $("micBtn").onclick = () => alert("Use Chrome for Voice input.");

    $("newBtn").onclick = newChat;
    $("menuBtn").onclick = () => { renderHist(); $("sideBg").style.display = "block"; };
    $("closeSide").onclick = () => $("sideBg").style.display = "none";
    $("plusBtn").onclick = () => $("sheet").style.display = "flex";
    $("optClose").onclick = () => $("sheet").style.display = "none";
    $("runClose").onclick = () => { $("runModal").style.display = "none"; $("runFrame").srcdoc = ""; };
    $("optPhoto").onclick = () => { $("sheet").style.display = "none"; $("fileIn").click(); };
    $("optDoc").onclick = () => { $("sheet").style.display = "none"; $("docIn").click(); };
    $("optImg").onclick = () => { $("sheet").style.display = "none"; $("imgModal").style.display = "flex"; };
    $("imCancel").onclick = () => $("imgModal").style.display = "none";
    $("optStudy").onclick = () => { $("sheet").style.display = "none"; study = !study; $("inp").placeholder = study ? "🎓 Study Mode ON..." : "Ask, speak, or create image..."; };
    $("optCode").onclick = () => { $("sheet").style.display = "none"; const c = prompt("HTML కోడ్ పేస్ట్ చేయండి:"); if (c) { $("runFrame").srcdoc = c; $("runModal").style.display = "flex"; } };

    $("clrAtt").onclick = () => { imgB64 = imgPrev = docCtx = null; $("fileIn").value = $("docIn").value = ""; $("prev").style.display = "none"; };
    $("fileIn").onchange = e => {
      const f = e.target.files[0]; if (!f) return; imgMime = f.type || "image/jpeg";
      const r = new FileReader(); r.onload = ev => { imgPrev = ev.target.result; imgB64 = imgPrev.split(",")[1]; $("pImg").src = imgPrev; $("pImg").style.display = "block"; $("pTxt").textContent = "Photo ready"; $("prev").style.display = "flex"; }; r.readAsDataURL(f);
    };

    $("docIn").onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      $("pImg").style.display = "none"; $("pTxt").textContent = "Reading " + f.name + "..."; $("prev").style.display = "flex";
      try {
        if (f.name.toLowerCase().endsWith(".pdf") && window.pdfjsLib) {
          pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
          const pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
          let txt = "";
          for (let i = 1; i <= Math.min(pdf.numPages, 12); i++) { const p = await pdf.getPage(i); txt += (await p.getTextContent()).items.map(x => x.str).join(" ") + "\n"; }
          docCtx = txt.slice(0, 12000);
        } else docCtx = (await f.text()).slice(0, 12000);
        $("pTxt").textContent = "📄 " + f.name + " ready!";
      } catch (err) { $("pTxt").textContent = "⚠️ File error"; }
    };

    function makeImg(p, size = "1024x1024", style = "") {
      const [w, h] = size.split("x");
      addMsg("🎨 Create image: " + p, "user"); push("🎨 Create image: " + p, "user");
      const box = addMsg("🎨 Creating HD image (~5s)...", "ai");
      const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(p + style)}?width=${w}&height=${h}&nologo=true&seed=${Math.floor(Math.random()*999999)}`;
      const im = new Image();
      im.onload = () => { box.d.remove(); addMsg("✨ " + p, "ai", url, true); push("✨ " + p, "ai", url, true); };
      im.onerror = () => { box.sp.textContent = "⚠️ Busy, try again."; };
      im.src = url;
    }

    $("imGo").onclick = () => { const p = $("imPrompt").value.trim(); if (!p) return; $("imgModal").style.display = "none"; $("imPrompt").value = ""; makeImg(p, $("imSize").value, $("imStyle").value); };

    async function send() {
      const txt = $("inp").value.trim();
      if (!txt && !imgB64 && !docCtx) return;
      if (!imgB64 && !docCtx && /create.*image|pic kavali|photo kavali|image kavali|^draw /i.test(txt)) { $("inp").value = ""; return makeImg(txt); }
      const disp = txt || (docCtx ? "Summarize document" : "Analyze photo");
      addMsg(disp, "user", imgPrev); push(disp, "user", imgPrev);
      let msg = (docCtx ? `Document:\n${docCtx}\n\nRequest: ` : "") + disp;
      if (study) msg = "[Explain clearly for student] " + msg;
      const sImg = imgB64, sMime = imgMime;
      $("inp").value = ""; $("clrAtt").click(); $("sendBtn").disabled = true;
      const box = addMsg("Thinking...", "ai");
      try {
        const res = await fetch(API + "/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: msg, image: sImg, mimeType: sMime }) });
        const d = await res.json();
        const rep = d.reply || ("⚠️ " + (d.error || "No reply"));
        box.sp.textContent = rep; addActions(box.d, rep, null, false); push(rep, "ai");
      } catch (e) { box.sp.textContent = "⚠️ Server waking up, wait 20s and tap Send."; }
      $("sendBtn").disabled = false;
    }

    $("sendBtn").onclick = send;
    $("inp").onkeypress = e => { if (e.key === "Enter") send(); };
    sessions.length ? load() : newChat();
  </script>
</body>
  </html>
