<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MMM Nexus</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #09090b; color: #f4f4f5; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    .top { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #111114; border-bottom: 1px solid #27272a; }
    .top h1 { font-size: 1.05rem; color: #fbbf24; }
    .btn { background: #18181b; color: #fbbf24; border: 1px solid #3f3f46; padding: 6px 11px; border-radius: 14px; font-weight: 700; font-size: 0.83rem; cursor: pointer; }
    .chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 88%; padding: 11px 14px; border-radius: 16px; font-size: 0.94rem; line-height: 1.55; word-wrap: break-word; }
    .ai { align-self: flex-start; background: #141417; border: 1px solid #27272a; border-left: 3px solid #f59e0b; }
    .user { align-self: flex-end; background: #f59e0b; color: #000; font-weight: 600; white-space: pre-wrap; }
    .msg img { max-width: 100%; border-radius: 10px; margin-bottom: 7px; display: block; }
    .u-edit { display: inline-block; margin-top: 5px; background: rgba(0,0,0,0.2); color: #000; border: none; padding: 3px 8px; border-radius: 7px; font-size: 0.74rem; font-weight: 700; cursor: pointer; }
    .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding-top: 6px; border-top: 1px solid #27272a; }
    .chip { background: #1f1f23; color: #fbbf24; border: 1px solid #3f3f46; padding: 4px 9px; border-radius: 8px; text-decoration: none; font-size: 0.76rem; font-weight: 700; cursor: pointer; }
    .c-box { background: #09090b; border: 1px solid #3f3f46; border-radius: 10px; margin: 7px 0; overflow: hidden; }
    .c-hdr { display: flex; justify-content: space-between; background: #1f1f23; padding: 4px 9px; font-size: 0.75rem; color: #a1a1aa; }
    .c-box pre { padding: 9px; overflow-x: auto; font-family: monospace; font-size: 0.82rem; color: #e4e4e7; white-space: pre; }
    .bar { display: flex; gap: 6px; padding: 9px; background: #111114; border-top: 1px solid #27272a; align-items: center; }
    .bar input[type="text"] { flex: 1; min-width: 0; background: #18181b; border: 1px solid #3f3f46; color: #fff; padding: 10px 12px; border-radius: 20px; font-size: 0.93rem; outline: none; }
    .ico { width: 38px; height: 38px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 1.05rem; }
    .send { background: #f59e0b; color: #000; border: none; padding: 10px 14px; border-radius: 20px; font-weight: 800; cursor: pointer; }
    .prev { display: none; padding: 8px 14px; background: #18181b; align-items: center; gap: 10px; font-size: 0.82rem; color: #fbbf24; border-top: 1px solid #27272a; }
    .prev img { width: 36px; height: 36px; object-fit: cover; border-radius: 6px; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.82); align-items: center; justify-content: center; padding: 14px; z-index: 50; }
    .card { width: 100%; max-width: 400px; background: #141417; border: 1px solid #f59e0b; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .card input, .card select { background: #18181b; border: 1px solid #3f3f46; color: #fff; padding: 10px; border-radius: 12px; }
    .side-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 60; }
    .side { width: 250px; height: 100%; background: #111114; border-right: 1px solid #27272a; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .h-item { display: flex; justify-content: space-between; background: #18181b; border: 1px solid #27272a; padding: 10px; border-radius: 10px; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="top">
    <div style="display:flex;gap:7px;align-items:center;"><button class="btn" id="menuBtn">&#9776;</button><h1>MMM NEXUS</h1></div>
    <div style="display:flex;gap:7px;"><button class="btn" id="imgBtn">Image</button><button class="btn" id="newBtn">+ New</button></div>
  </div>
  <div class="side-bg" id="sideBg"><div class="side"><div style="display:flex;justify-content:space-between;color:#fbbf24;font-weight:800;"><span>History</span><button class="btn" id="closeSide">X</button></div><div id="hList" style="display:flex;flex-direction:column;gap:8px;overflow-y:auto;"></div></div></div>
  <div class="chat" id="chat"></div>
  <div class="prev" id="prev"><img id="pImg" src="" /><span id="pTxt" style="flex:1">Photo ready</span><button class="btn" id="clrAtt">X</button></div>
  <div class="bar">
    <input type="file" id="fileIn" accept="image/*" style="display:none" />
    <button class="btn ico" id="camBtn">+</button>
    <input type="text" id="inp" placeholder="Ask anything in any language..." />
    <button class="send" id="sendBtn">Send</button>
  </div>
  <div class="modal" id="imgModal"><div class="card">
    <h3 style="color:#fbbf24">AI Image Studio</h3>
    <input type="text" id="imPrompt" placeholder="Describe image..." />
    <select id="imSize"><option value="1024x1024">Square (1:1)</option><option value="1280x720">YouTube (16:9)</option><option value="720x1280">Reel (9:16)</option></select>
    <div style="display:flex;gap:8px;justify-content:flex-end;"><button class="btn" id="imCancel">Cancel</button><button class="send" id="imGo">Generate</button></div>
  </div></div>
  <script>
    var API = "https://mmm-nexus-backend.onrender.com";
    var TK = String.fromCharCode(96, 96, 96);
    var NL = String.fromCharCode(10);
    var imgB64 = null, imgMime = "image/jpeg", imgPrev = null, sessions = [], curId = null, imgCool = 0;
    function $(id) { return document.getElementById(id); }
    try { sessions = JSON.parse(localStorage.getItem("mmm_clean1") || "[]"); } catch (e) { sessions = []; }
    function save() { try { localStorage.setItem("mmm_clean1", JSON.stringify(sessions)); } catch (e) {} }
    function copyTxt(t, b) { navigator.clipboard.writeText(t).then(function() { b.textContent = "Copied!"; setTimeout(function() { b.textContent = "Copy"; }, 1400); }); }
    function fmt(raw) {
      var e = raw.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"), bl = [];
      e = e.split(TK).map(function(part, idx) {
        if (idx % 2 === 1) {
          var nl = part.indexOf(NL), lang = nl > -1 ? part.slice(0, nl).trim() : "code", code = (nl > -1 ? part.slice(nl + 1) : part).trim();
          bl.push({ l: lang || "code", c: code });
          return "@@C" + (bl.length - 1) + "@@";
        }
        return part;
      }).join("");
      e = e.replace(/^### (.*$)/gm, "<h3>$1</h3>").replace(/^## (.*$)/gm, "<h2>$1</h2>").replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>").replace(/^[*-] (.*$)/gm, "<li>$1</li>");
      e = e.split(NL).join("<br>");
      bl.forEach(function(b, i) { e = e.replace("@@C" + i + "@@", '<div class="c-box"><div class="c-hdr"><span>' + b.l + '</span><button class="chip cc" data-i="' + i + '">Copy Code</button></div><pre>' + b.c + '</pre></div>'); });
      return { html: e, bl: bl };
    }
    function addMsg(t, y, img, canSave, idx) {
      var d = document.createElement("div"); d.className = "msg " + y;
      if (img) { var im = document.createElement("img"); im.src = img; d.appendChild(im); }
      var box = document.createElement("div");
      if (y === "user") {
        box.textContent = t;
        var eb = document.createElement("button"); eb.className = "u-edit"; eb.textContent = "Edit";
        eb.onclick = function() {
          var s = sessions.find(function(x) { return x.id === curId; });
          if (s && idx >= 0) { s.msgs = s.msgs.slice(0, idx); save(); load(); }
          $("inp").value = t; $("inp").focus();
        };
        d.appendChild(box); d.appendChild(eb); $("chat").appendChild(d); $("chat").scrollTop = $("chat").scrollHeight;
        return { d: d, box: box };
      }
      var p = fmt(t); box.innerHTML = p.html;
      box.querySelectorAll(".cc").forEach(function(b) { b.onclick = function() { copyTxt(p.bl[b.dataset.i].c, b); }; });
      d.appendChild(box);
      var row = document.createElement("div"); row.className = "acts";
      if (canSave && img) { row.innerHTML = '<a href="' + img + '" target="_blank" download="MMM.jpg" class="chip">Save HD</a>'; }
      else if (t) {
        var b1 = document.createElement("button"); b1.className = "chip"; b1.textContent = "Copy"; b1.onclick = function() { copyTxt(t, b1); }; row.appendChild(b1);
      }
      if (row.children.length) d.appendChild(row);
      $("chat").appendChild(d); $("chat").scrollTop = $("chat").scrollHeight;
      return { d: d, box: box };
    }
    function newChat() {
      curId = Date.now().toString();
      sessions.unshift({ id: curId, title: "New Chat", msgs: [{ t: "Hello **Murali**! MMM Nexus is LIVE. Ask anything in any language!", y: "ai" }] });
      save(); load();
    }
    function load() {
      var s = sessions.find(function(x) { return x.id === curId; }) || sessions[0];
      if (!s) return newChat();
      curId = s.id; $("chat").innerHTML = "";
      s.msgs.forEach(function(m, i) { addMsg(m.t, m.y, m.img, m.save, i); });
    }
    function push(t, y, img, sf) {
      var s = sessions.find(function(x) { return x.id === curId; });
      if (!s) return -1;
      if (y === "user" && s.title === "New Chat") s.title = t.slice(0, 22);
      s.msgs.push({ t: t, y: y, img: img, save: sf }); save();
      return s.msgs.length - 1;
    }
    $("newBtn").onclick = newChat;
    $("menuBtn").onclick = function() {
      $("hList").innerHTML = "";
      sessions.forEach(function(s) {
        var r = document.createElement("div"); r.className = "h-item"; r.textContent = s.title;
        r.onclick = function() { curId = s.id; load(); $("sideBg").style.display = "none"; };
        $("hList").appendChild(r);
      });
      $("sideBg").style.display = "block";
    };
    $("closeSide").onclick = function() { $("sideBg").style.display = "none"; };
    $("imgBtn").onclick = function() { $("imgModal").style.display = "flex"; };
    $("imCancel").onclick = function() { $("imgModal").style.display = "none"; };
    $("camBtn").onclick = function() { $("fileIn").click(); };
    $("clrAtt").onclick = function() { imgB64 = null; imgPrev = null; $("fileIn").value = ""; $("prev").style.display = "none"; };
    $("fileIn").onchange = function(e) {
      var f = e.target.files[0]; if (!f) return; imgMime = f.type || "image/jpeg";
      var r = new FileReader(); r.onload = function(ev) { imgPrev = ev.target.result; imgB64 = imgPrev.split(",")[1]; $("pImg").src = imgPrev; $("prev").style.display = "flex"; }; r.readAsDataURL(f);
    };
    $("imGo").onclick = function() {
      var p = $("imPrompt").value.trim(); if (!p) return;
      $("imgModal").style.display = "none"; $("imPrompt").value = "";
      var wSec = Math.ceil((imgCool - Date.now()) / 1000);
      if (wSec > 0) return addMsg("Wait **" + wSec + "s** for next image.", "ai");
      var wh = $("imSize").value.split("x"), idx = push("Create image: " + p, "user");
      addMsg("Create image: " + p, "user", null, false, idx);
      var ld = addMsg("Generating image...", "ai");
      var url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(p) + "?width=" + wh[0] + "&height=" + wh[1] + "&nologo=true&model=flux&seed=" + Math.floor(Math.random() * 999999);
      var im = new Image();
      im.onload = function() { imgCool = Date.now() + 45000; ld.d.remove(); addMsg(p, "ai", url, true); push(p, "ai", url, true); };
      im.onerror = function() { ld.box.textContent = "Image server busy. Try again in 30s."; };
      im.src = url;
    };
    async function send() {
      var txt = $("inp").value.trim(); if (!txt && !imgB64) return;
      var disp = txt || "Analyze photo";
      var s = sessions.find(function(x) { return x.id === curId; });
      var hist = s ? s.msgs.slice(-6).map(function(m) { return (m.y === "user" ? "User: " : "Assistant: ") + m.t; }).join(NL) : "";
      var idx = push(disp, "user", imgPrev);
      addMsg(disp, "user", imgPrev, false, idx);
      var msg = (hist ? "Recent Chat:" + NL + hist + NL + NL : "") + "Request: " + disp;
      var sImg = imgB64, sMime = imgMime;
      $("inp").value = ""; $("clrAtt").click(); $("sendBtn").disabled = true;
      var ld = addMsg("Thinking...", "ai");
      try {
        var res = await fetch(API + "/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: msg, image: sImg, mimeType: sMime }) });
        var d = await res.json();
        var rep = d.reply || ("Error: " + (d.error || "No reply"));
        ld.d.remove(); addMsg(rep, "ai"); if (d.reply) push(rep, "ai");
      } catch (e) { ld.d.remove(); addMsg("Server waking up (Render free tier). Wait 20s and send again.", "ai"); }
      $("sendBtn").disabled = false;
    }
    $("sendBtn").onclick = send;
    $("inp").onkeypress = function(e) { if (e.key === "Enter") send(); };
    if (sessions.length) { load(); } else { newChat(); }
  </script>
</body>
  </html>
