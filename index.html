<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#09090b" />
  <title>MMM Nexus | AI</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #09090b; color: #f4f4f5; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    .top { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #111114; border-bottom: 1px solid #27272a; }
    .row { display: flex; align-items: center; gap: 7px; }
    .top h1 { font-size: 1.05rem; color: #fbbf24; }
    .btn { background: #18181b; color: #fbbf24; border: 1px solid #3f3f46; padding: 6px 11px; border-radius: 14px; font-weight: 700; font-size: 0.83rem; cursor: pointer; }
    .chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 88%; padding: 11px 14px; border-radius: 16px; font-size: 0.94rem; line-height: 1.55; word-wrap: break-word; }
    .ai { align-self: flex-start; background: #141417; border: 1px solid #27272a; border-left: 3px solid #f59e0b; }
    .user { align-self: flex-end; background: #f59e0b; color: #000; font-weight: 600; white-space: pre-wrap; }
    .msg img { max-width: 100%; border-radius: 10px; margin-bottom: 7px; display: block; }
    .u-edit { display: inline-block; margin-top: 5px; background: rgba(0,0,0,0.18); color: #000; border: none; padding: 3px 8px; border-radius: 7px; font-size: 0.74rem; font-weight: 700; cursor: pointer; }
    .md h2, .md h3 { color: #fbbf24; margin: 6px 0 3px; font-size: 1rem; }
    .md ul { padding-left: 18px; margin: 4px 0; }
    .c-box { background: #09090b; border: 1px solid #3f3f46; border-radius: 10px; margin: 7px 0; overflow: hidden; }
    .c-hdr { display: flex; justify-content: space-between; background: #1f1f23; padding: 4px 9px; font-size: 0.75rem; color: #a1a1aa; }
    .c-box pre { padding: 9px; overflow-x: auto; font-family: monospace; font-size: 0.82rem; color: #e4e4e7; white-space: pre; }
    .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding-top: 6px; border-top: 1px solid #27272a; }
    .chip { background: #1f1f23; color: #fbbf24; border: 1px solid #3f3f46; padding: 4px 9px; border-radius: 8px; text-decoration: none; font-size: 0.76rem; font-weight: 700; cursor: pointer; }
    .sugs { display: flex; flex-wrap: wrap; gap: 7px; }
    .sug { background: #18181b; border: 1px solid #3f3f46; color: #e4e4e7; padding: 7px 11px; border-radius: 15px; font-size: 0.81rem; cursor: pointer; }
    .prev { display: none; padding: 8px 14px; background: #18181b; align-items: center; gap: 10px; font-size: 0.82rem; color: #fbbf24; border-top: 1px solid #27272a; }
    .prev img { width: 36px; height: 36px; object-fit: cover; border-radius: 6px; }
    .bar { display: flex; gap: 6px; padding: 9px; background: #111114; border-top: 1px solid #27272a; align-items: center; }
    .bar input[type="text"] { flex: 1; min-width: 0; background: #18181b; border: 1px solid #3f3f46; color: #fff; padding: 10px 12px; border-radius: 20px; font-size: 0.93rem; outline: none; }
    .ico { width: 38px; height: 38px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 1.05rem; }
    .ico.rec { background: #dc2626; color: #fff; border-color: #ef4444; }
    .send { background: #f59e0b; color: #000; border: none; padding: 10px 14px; border-radius: 20px; font-weight: 800; cursor: pointer; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.82); align-items: flex-end; z-index: 50; }
    .modal.c { align-items: center; justify-content: center; padding: 14px; }
    .sheet { width: 100%; background: #141417; border-top: 1px solid #f59e0b; border-radius: 20px 20px 0 0; padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .opt { background: #1f1f23; border: 1px solid #3f3f46; color: #fbbf24; padding: 13px 10px; border-radius: 14px; font-weight: 700; font-size: 0.86rem; text-align: center; cursor: pointer; }
    .card { width: 100%; max-width: 420px; background: #141417; border: 1px solid #f59e0b; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .card input, .card select { background: #18181b; border: 1px solid #3f3f46; color: #fff; padding: 10px; border-radius: 12px; font-size: 0.9rem; outline: none; }
    .side-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 60; }
    .side { width: 260px; max-width: 80vw; height: 100%; background: #111114; border-right: 1px solid #27272a; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .h-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .h-item { display: flex; justify-content: space-between; align-items: center; background: #18181b; border: 1px solid #27272a; padding: 10px; border-radius: 10px; font-size: 0.85rem; cursor: pointer; }
    .h-item.act { border-color: #f59e0b; }
    .run-box { width: 100%; height: 85vh; background: #fff; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; border: 2px solid #f59e0b; }
    .run-box iframe { flex: 1; width: 100%; border: none; background: #fff; }
  </style>
</head>
<body>
  <div class="top">
    <div class="row"><button class="btn" id="menuBtn">☰</button><h1>✨ MMM NEXUS</h1></div>
    <div class="row"><button class="btn" id="instBtn">📲 App</button><button class="btn" id="newBtn">+ New</button></div>
  </div>
  <div class="side-bg" id="sideBg"><div class="side"><div style="display:flex;justify-content:space-between;color:#fbbf24;font-weight:800;"><span>💬 History</span><button class="btn" id="closeSide">✕</button></div><div class="h-list" id="hList"></div></div></div>
  <div class="chat" id="chat"></div>
  <div class="prev" id="prev"><img id="pImg" src="" /><span id="pTxt" style="flex:1">Ready</span><button class="btn" id="clrAtt">✕</button></div>
  <div class="bar">
    <input type="file" id="fileIn" accept="image/*" style="display:none" />
    <input type="file" id="docIn" accept=".pdf,.txt,.md,.csv,.html,.js,.py" style="display:none" />
    <button class="btn ico" id="plusBtn">+</button>
    <input type="text" id="inp" placeholder="Ask anything in any language..." />
    <button class="btn ico" id="micBtn">🎤</button>
    <button class="send" id="sendBtn">Send</button>
  </div>
  <div class="modal" id="sheet"><div class="sheet">
    <div class="opt" id="optPhoto">📷 Analyze Photo</div>
    <div class="opt" id="optImg">🎨 AI Image Studio</div>
    <div class="opt" id="optDoc">📄 PDF / Notes</div>
    <div class="opt" id="optStudy">🎓 Study Helper</div>
    <div class="opt" id="optCode">💻 Live Code Box</div>
    <div class="opt" id="optClose">✕ Close</div>
  </div></div>
  <div class="modal c" id="imgModal"><div class="card">
    <h3 style="color:#fbbf24">🎨 AI Image Studio</h3>
    <input type="text" id="imPrompt" placeholder="Describe image (e.g. Royal lion)" />
    <select id="imSize"><option value="1024x1024">Square (1:1)</option><option value="1280x720">YouTube (16:9)</option><option value="720x1280">Status / Reel (9:16)</option></select>
    <select id="imStyle"><option value="">Default HD</option><option value=", ultra realistic 8k photo">Realistic</option><option value=", 3D Pixar cartoon style">3D Cartoon</option><option value=", Telugu cinema mass poster style">Cinema Poster</option></select>
    <div style="display:flex;gap:8px;justify-content:flex-end;"><button class="btn" id="imCancel">Cancel</button><button class="send" id="imGo">Generate</button></div>
  </div></div>
  <div class="modal c" id="runModal"><div class="run-box"><div style="background:#111114;color:#fbbf24;padding:10px;display:flex;justify-content:space-between;font-weight:700;"><span>💻 Live Preview</span><button class="btn" id="runClose">✕</button></div><iframe id="runFrame"></iframe></div></div>
  <script>
    var API = "https://mmm-nexus-backend.onrender.com";
    var TK = String.fromCharCode(96, 96, 96);
    var NL = String.fromCharCode(10);
    var imgB64 = null;
    var imgMime = "image/jpeg";
    var imgPrev = null;
    var docCtx = null;
    var study = false;
    var sessions = [];
    var curId = null;
    var defPrompt = null;
    var lastReq = null;
    var imgCool = 0;

    function $(id) {
      return document.getElementById(id);
    }

    try {
      sessions = JSON.parse(localStorage.getItem("mmm_v12") || "[]");
    } catch (e) {
      sessions = [];
    }

    window.addEventListener("beforeinstallprompt", function(e) {
      e.preventDefault();
      defPrompt = e;
    });

    $("instBtn").onclick = function() {
      if (defPrompt) {
        defPrompt.prompt();
      } else {
        alert("Chrome (⋮) -> Add to Home screen");
      }
    };

    function save() {
      try {
        localStorage.setItem("mmm_v12", JSON.stringify(sessions));
      } catch (e) {}
      renderHist();
    }

    function copy(t, b) {
      navigator.clipboard.writeText(t).then(function() {
        var o = b.textContent;
        b.textContent = "✅ Copied";
        setTimeout(function() {
          b.textContent = o;
        }, 1400);
      });
    }

    function renderHist() {
      $("hList").innerHTML = "";
      sessions.forEach(function(s) {
        var r = document.createElement("div");
        r.className = "h-item" + (s.id === curId ? " act" : "");
        r.innerHTML = '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px">' + s.title + '</span><span style="color:#ef4444">🗑️</span>';
        r.lastChild.onclick = function(e) {
          e.stopPropagation();
          sessions = sessions.filter(function(x) { return x.id !== s.id; });
          if (sessions.length) {
            curId = sessions[0].id;
            save();
            load();
          } else {
            newChat();
          }
        };
        r.onclick = function() {
          curId = s.id;
          save();
          load();
          $("sideBg").style.display = "none";
        };
        $("hList").appendChild(r);
      });
    }

    function fmt(raw) {
      var e = raw.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      var bl = [];
      e = e.split(TK).map(function(part, idx) {
        if (idx % 2 === 1) {
          var nl = part.indexOf(NL);
          var lang = nl > -1 ? part.slice(0, nl).trim() : "code";
          var code = (nl > -1 ? part.slice(nl + 1) : part).trim();
          bl.push({ l: lang || "code", c: code });
          return "@@C" + (bl.length - 1) + "@@";
        }
        return part;
      }).join("");
      e = e.replace(/^### (.*$)/gm, "<h3>$1</h3>");
      e = e.replace(/^## (.*$)/gm, "<h2>$1</h2>");
      e = e.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
      e = e.replace(/^[*-] (.*$)/gm, "<li>$1</li>");
      e = e.split(NL).join("<br>");
      bl.forEach(function(b, i) {
        e = e.replace("@@C" + i + "@@", '<div class="c-box"><div class="c-hdr"><span>' + b.l + '</span><button class="chip cc" data-i="' + i + '">📋 Copy Code</button></div><pre>' + b.c + '</pre></div>');
      });
      return { html: e, bl: bl };
    }

    function speak(t) {
      if (!("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t.split(TK)[0]);
      u.lang = /[\u0C00-\u0C7F]/.test(t) ? "te-IN" : (/[\u0900-\u097F]/.test(t) ? "hi-IN" : "en-IN");
      speechSynthesis.speak(u);
    }

    function addMsg(t, y, img, canSave, isErr, idx) {
      var d = document.createElement("div");
      d.className = "msg " + y;
      if (img) {
        var im = document.createElement("img");
        im.src = img;
        d.appendChild(im);
      }
      var box = document.createElement("div");
      if (y === "user") {
        box.textContent = t;
        var eb = document.createElement("button");
        eb.className = "u-edit";
        eb.textContent = "✏️ Edit";
        eb.onclick = function() {
          var s = sessions.find(function(x) { return x.id === curId; });
          if (s && idx >= 0) {
            s.msgs = s.msgs.slice(0, idx);
            save();
            load();
          }
          $("inp").value = t.replace(/^🎨 Create image: /, "");
          $("inp").focus();
        };
        d.appendChild(box);
        d.appendChild(eb);
        $("chat").appendChild(d);
        $("chat").scrollTop = $("chat").scrollHeight;
        return { d: d, box: box };
      }
      box.className = "md";
      var p = fmt(t);
      box.innerHTML = p.html;
      box.querySelectorAll(".cc").forEach(function(b) {
        b.onclick = function() {
          copy(p.bl[b.dataset.i].c, b);
        };
      });
      d.appendChild(box);
      var row = document.createElement("div");
      row.className = "acts";
      if (canSave && img) {
        row.innerHTML = '<a href="' + img + '" target="_blank" download="MMM.jpg" class="chip">⬇️ Save HD</a>';
      } else if (t) {
        var b1 = document.createElement("button");
        b1.className = "chip";
        b1.textContent = "📋 Copy";
        b1.onclick = function() { copy(t, b1); };
        row.appendChild(b1);

        var b2 = document.createElement("button");
        b2.className = "chip";
        b2.textContent = "🔊 Listen";
        b2.onclick = function() { speak(t); };
        row.appendChild(b2);

        var codeBlock = p.bl.find(function(x) { return x.c.indexOf("<") > -1; });
        var code = codeBlock ? codeBlock.c : (t.indexOf("<html") > -1 ? t : null);
        if (code) {
          var b3 = document.createElement("button");
          b3.className = "chip";
          b3.textContent = "▶️ Run";
          b3.onclick = function() {
            $("runFrame").srcdoc = code;
            $("runModal").style.display = "flex";
          };
          row.appendChild(b3);
        }
        if (isErr && lastReq) {
          var b4 = document.createElement("button");
          b4.className = "chip";
          b4.textContent = "🔄 Retry";
          b4.onclick = function() {
            $("inp").value = lastReq;
            send();
          };
          row.appendChild(b4);
        }
      }
      if (row.children.length) d.appendChild(row);
      $("chat").appendChild(d);
      $("chat").scrollTop = $("chat").scrollHeight;
      return { d: d, box: box };
    }

    function newChat() {
      curId = Date.now().toString();
      sessions.unshift({
        id: curId,
        title: "New Chat",
        msgs: [{ t: "Hello **Murali**! Welcome to **MMM Nexus** 🚀" + NL + "Ask me in **any language** (Telugu, English, Hindi, Tamil, etc.) — with **Edit**, **Copy**, **Memory**, **Image Studio** & **PDF Reader**!", y: "ai" }]
      });
      save();
      load();
      var r = document.createElement("div");
      r.className = "sugs";
      var items = [
        ["✍️ HTML Page", "Create a modern portfolio webpage in HTML and CSS"],
        ["🎓 Explain Topic", "Explain Cloud Computing simply with bullet points"],
        ["🎨 Create Image", ""],
        ["📄 Read PDF", ""]
      ];
      items.forEach(function(item) {
        var b = document.createElement("button");
        b.className = "sug";
        b.textContent = item[0];
        b.onclick = function() {
          if (item[1]) {
            $("inp").value = item[1];
            send();
          } else if (item[0].indexOf("Image") > -1) {
            $("imgModal").style.display = "flex";
          } else {
            $("docIn").click();
          }
        };
        r.appendChild(b);
      });
      $("chat").appendChild(r);
    }

    function load() {
      var s = sessions.find(function(x) { return x.id === curId; }) || sessions[0];
      if (!s) return newChat();
      curId = s.id;
      $("chat").innerHTML = "";
      s.msgs.forEach(function(m, i) {
        addMsg(m.t, m.y, m.img, m.save, false, i);
      });
    }

    function push(t, y, img, sf) {
      var s = sessions.find(function(x) { return x.id === curId; });
      if (!s) return -1;
      if (y === "user" && s.title === "New Chat") s.title = t.slice(0, 22);
      s.msgs.push({ t: t, y: y, img: img, save: sf });
      save();
      return s.msgs.length - 1;
    }

    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      var r = new SR();
      r.lang = "en-IN";
      r.onstart = function() { $("micBtn").classList.add("rec"); };
      r.onend = function() { $("micBtn").classList.remove("rec"); };
      r.onresult = function(e) {
        $("inp").value = ($("inp").value + " " + e.results[0][0].transcript).trim();
      };
      $("micBtn").onclick = function() {
        try { r.start(); } catch (e) {}
      };
    }

    $("newBtn").onclick = newChat;
    $("menuBtn").onclick = function() { renderHist(); $("sideBg").style.display = "block"; };
    $("closeSide").onclick = function() { $("sideBg").style.display = "none"; };
    $("plusBtn").onclick = function() { $("sheet").style.display = "flex"; };
    $("optClose").onclick = function() { $("sheet").style.display = "none"; };
    $("runClose").onclick = function() { $("runModal").style.display = "none"; $("runFrame").srcdoc = ""; };
    $("optPhoto").onclick = function() { $("sheet").style.display = "none"; $("fileIn").click(); };
    $("optDoc").onclick = function() { $("sheet").style.display = "none"; $("docIn").click(); };
    $("optImg").onclick = function() { $("sheet").style.display = "none"; $("imgModal").style.display = "flex"; };
    $("imCancel").onclick = function() { $("imgModal").style.display = "none"; };
    $("optStudy").onclick = function() {
      $("sheet").style.display = "none";
      study = !study;
      $("inp").placeholder = study ? "🎓 Study Mode ON..." : "Ask anything in any language...";
    };
    $("optCode").onclick = function() {
      $("sheet").style.display = "none";
      var c = prompt("Paste HTML code:");
      if (c) {
        $("runFrame").srcdoc = c;
        $("runModal").style.display = "flex";
      }
    };
    $("clrAtt").onclick = function() {
      imgB64 = null;
      imgPrev = null;
      docCtx = null;
      $("fileIn").value = "";
      $("docIn").value = "";
      $("prev").style.display = "none";
    };

    $("fileIn").onchange = function(e) {
      var f = e.target.files[0];
      if (!f) return;
      imgMime = f.type || "image/jpeg";
      var r = new FileReader();
      r.onload = function(ev) {
        imgPrev = ev.target.result;
        imgB64 = imgPrev.split(",")[1];
        $("pImg").src = imgPrev;
        $("pImg").style.display = "block";
        $("pTxt").textContent = "Photo ready";
        $("prev").style.display = "flex";
      };
      r.readAsDataURL(f);
    };

    $("docIn").onchange = async function(e) {
      var f = e.target.files[0];
      if (!f) return;
      $("pImg").style.display = "none";
      $("pTxt").textContent = "Reading " + f.name + "...";
      $("prev").style.display = "flex";
      try {
        if (f.name.toLowerCase().endsWith(".pdf") && window.pdfjsLib) {
          pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
          var pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
          var txt = "";
          for (var i = 1; i <= Math.min(pdf.numPages, 12); i++) {
            var p = await pdf.getPage(i);
            txt += (await p.getTextContent()).items.map(function(x) { return x.str; }).join(" ") + NL;
          }
          docCtx = txt.slice(0, 12000);
        } else {
          docCtx = (await f.text()).slice(0, 12000);
        }
        $("pTxt").textContent = "📄 " + f.name + " ready!";
      } catch (err) {
        $("pTx
